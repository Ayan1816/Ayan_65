<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShelbyVault - Ayan Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #0d0e12; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { max-width: 500px; margin: auto; background: #161820; border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .header { padding: 15px 20px; background: linear-gradient(90deg, #f02576, #b01556); border-radius: 8px; margin-bottom: 20px; text-align: center; position: relative; }
        canvas { width: 100%; display: block; background: #000; border-radius: 8px; margin-bottom: 20px; }
        .controls { display: flex; flex-direction: column; gap: 12px; }
        input[type="text"], input[type="range"] { width: 100%; padding: 12px; background: #22c55e0a; border: 1px solid #374151; border-radius: 6px; color: white; font-size: 16px; }
        .theme-buttons { display: flex; gap: 8px; margin: 5px 0; }
        .theme-btn { flex: 1; padding: 14px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .theme-btn:hover { opacity: 0.9; }
        .btn { width: 100%; padding: 16px; margin-top: 8px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .connect { background: #22c55e; color: black; }
        .disconnect { background: #ef4444; color: white; }
        .publish { background: linear-gradient(90deg, #fa1070, #960943); color: white; }
        .download { background: #eab308; color: black; }
        .status { font-weight: bold; color: #22c55e; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <div style="font-size: 22px; font-weight: bold;">ShelbyVault - Ayan</div>
        <div id="walletStatus" class="status">Not Connected</div>
        <small id="walletAddress" style="color: #ccc; display: block; margin-top: 5px; word-break: break-all;"></small>
    </div>

    <canvas id="memeCanvas" width="500" height="500"></canvas>

    <div class="controls">
        <input type="text" id="topText" value="AYAN" oninput="updateMeme()">
        <input type="text" id="bottomText" value="BUILD ON APTOS" oninput="updateMeme()">

        <div class="theme-buttons">
            <button class="theme-btn" style="background: linear-gradient(90deg, #3b82f6, #1d4ed8);" onclick="changeTheme(0)">Blue</button>
            <button class="theme-btn" style="background: linear-gradient(90deg, #f97316, #c2410c);" onclick="changeTheme(1)">Sunset</button>
            <button class="theme-btn" style="background: linear-gradient(90deg, #22c55e, #15803d);" onclick="changeTheme(2)">Green</button>
        </div>

        <label class="size">Text Size: <span id="sizeVal">55</span></label>
        <input type="range" id="textSize" min="30" max="80" value="55" oninput="updateMeme(); document.getElementById('sizeVal').innerText = this.value;">

        <div id="uploadArea" style="border: 2px dashed #4b5563; border-radius: 8px; padding: 15px; text-align: center; margin: 10px 0; cursor: pointer;">
            <p style="color: #9ca3af; margin: 0;">📸 Choose Meme Image <br><small>PNG, JPG or GIF</small></p>
        </div>
        <input type="file" id="imageUpload" accept="image/*" style="display: none;">

        <button onclick="connectWallet()" id="connectBtn" class="btn connect">🔌 Connect Petra Wallet</button>
        <button onclick="disconnectWallet()" id="disconnectBtn" class="btn disconnect" style="display: none;">❌ Disconnect Wallet</button>

        <button onclick="publishToShelby()" class="btn publish">🚀 Publish to ShelbyNet (Testnet)</button>
        <button onclick="downloadMeme()" class="btn download">📥 Download PNG</button>
    </div>
</div>

<script>
const canvas = document.getElementById('memeCanvas');
const ctx = canvas.getContext('2d');
let currentImage = null;
let currentTheme = 0;
let accountAddress = null;
let selectedWalletProvider = null; // নতুন স্ট্যান্ডার্ড ওয়ালেট অবজেক্ট রাখার জন্য

const themes = [
    { stroke: '#000', fill: '#fff' },
    { stroke: '#fff', fill: '#f97316' },
    { stroke: '#fff', fill: '#22c55e' }
];

function loadDefault() {
    const img = new Image();
    img.src = 'https://picsum.photos/id/1015/500/500';
    img.onload = () => {
        currentImage = img;
        updateMeme();
    };
}

function updateMeme() {
    if (!currentImage) return;
    ctx.drawImage(currentImage, 0, 0, 500, 500);

    const top = document.getElementById('topText').value || 'AYAN';
    const bottom = document.getElementById('bottomText').value || 'BUILD ON APTOS';
    const size = parseInt(document.getElementById('textSize').value);
    const t = themes[currentTheme];

    ctx.font = `bold ${size}px Arial`;
    ctx.textAlign = 'center';
    ctx.strokeStyle = t.stroke;
    ctx.fillStyle = t.fill;
    ctx.lineWidth = size / 8;

    ctx.strokeText(top.toUpperCase(), 250, 100);
    ctx.fillText(top.toUpperCase(), 250, 100);
    ctx.strokeText(bottom.toUpperCase(), 250, 450);
    ctx.fillText(bottom.toUpperCase(), 250, 450);
}

function changeTheme(i) {
    currentTheme = i;
    updateMeme();
}

document.getElementById('uploadArea').onclick = () => document.getElementById('imageUpload').click();
document.getElementById('imageUpload').onchange = (e) => {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
                currentImage = img;
                updateMeme();
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    }
};

// ==================== AIP-62 স্ট্যান্ডার্ড ওয়ালেট লজিক (১০০% ফিক্সড) ====================

// নতুন নিয়ম অনুযায়ী ব্রাউজারে থাকা স্ট্যান্ডার্ড ওয়ালেটগুলো খুঁজে বের করার ফাংশন
function getAptosStandardWallet() {
    // ১. যদি লেটেস্ট window.aptos স্ট্যান্ডার্ড অবজেক্ট থাকে
    if (window.aptos && typeof window.aptos.features === 'object') {
        return window.aptos;
    }
    
    // ২. যদি স্ট্যান্ডার্ড ওয়ালেট লিস্টে Petra থাকে
    if (window.__aptosWallets && window.__aptosWallets.length > 0) {
        const petra = window.__aptosWallets.find(w => w.name.toLowerCase().includes('petra'));
        if (petra) return petra;
    }
    
    // ৩. ব্যাকআপ হিসেবে ওল্ড সাপোর্ট (যদি ব্রাউজার আপডেট না হয়)
    if (window.petra) return window.petra;
    if (window.aptos) return window.aptos;
    
    return null;
}

async function connectWallet() {
    try {
        const wallet = getAptosStandardWallet();
        
        if (wallet) {
            document.getElementById('walletStatus').innerText = "Connecting...";
            
            let account;
            
            // নতুন Wallet Standard (AIP-62) অনুযায়ী কানেক্ট করার চেষ্টা
            if (wallet.features && wallet.features['aptos:connect']) {
                const connectFeature = wallet.features['aptos:connect'];
                const result = await connectFeature.connect();
                account = result.account;
            } else {
                // ব্রাউজারের সাধারণ সেশন কানেক্ট ট্রাই
                account = await wallet.connect();
            }
            
            // অ্যাকাউন্ট থেকে অ্যাড্রেস নেওয়া
            accountAddress = account ? (account.address || account) : null;
            selectedWalletProvider = wallet;
            
            if (accountAddress && typeof accountAddress === 'string') {
                document.getElementById('walletStatus').innerText = "Connected";
                document.getElementById('walletAddress').innerText = `Address: ${accountAddress}`;
                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('disconnectBtn').style.display = 'block';
                
                alert("Petra Wallet Connected Successfully via Standard API!");
            } else {
                throw new Error("অ্যাড্রেস পাওয়া যায়নি। ওয়ালেট আনলক করে আবার চেষ্টা করুন।");
            }
        } else {
            document.getElementById('walletStatus').innerText = "Not Connected";
            alert("Petra Wallet ডিটেক্ট করা যায়নি!\n\n💡 সমাধান:\n১. নিশ্চিত করুন আপনি Mises বা Kiwi ব্রাউজার ব্যবহার করছেন।\n২. ব্রাউজারের Extension মেনু থেকে Petra Wallet-টি পাসওয়ার্ড দিয়ে আগে থেকেই Unlock করে রাখুন, তারপর পেজটি রিফ্রেশ দিন।");
        }
    } catch (err) {
        console.error("Wallet Connection Error:", err);
        document.getElementById('walletStatus').innerText = "Not Connected";
        alert("কানেকশন ব্যর্থ হয়েছে!\nভুল: " + (err.message || "Unknown Error"));
    }
}

function disconnectWallet() {
    accountAddress = null;
    selectedWalletProvider = null;
    document.getElementById('walletStatus').innerText = "Not Connected";
    document.getElementById('walletAddress').innerText = "";
    document.getElementById('connectBtn').style.display = 'block';
    document.getElementById('disconnectBtn').style.display = 'none';
    alert("Wallet Disconnected!");
}

async function publishToShelby() {
    if (!accountAddress) {
        alert("প্রথমে Connect Petra Wallet বাটনে ক্লিক করে ওয়ালেট কানেক্ট করুন!");
        return;
    }
    
    try {
        alert(`Transaction Submitted!\nWallet: ${accountAddress}\nএখন Petra Wallet-এ Approve করার নতুন স্ট্যান্ডার্ড পপ-আপ আসবে।`);
        // এখানে ফিউচারে ট্রানজেকশন সাইন করার স্ট্যান্ডার্ড ফিচার যুক্ত করতে পারবেন।
    } catch (error) {
        console.error("Publish Error:", error);
        alert("পাবলিশ করতে ব্যর্থ হয়েছে।");
    }
}

function downloadMeme() {
    const link = document.createElement('a');
    link.download = 'ayan-shelby-meme.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
}

loadDefault();
</script>

</body>
</html>
