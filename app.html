<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShelbyVault - Ayan Edition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0a14;
      color: white;
      padding: 10px;
      min-height: 100vh;
    }
    .card {
      max-width: 500px;
      margin: auto;
      background: #111827;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 50px rgba(0,0,0,0.7);
    }
    .header {
      padding: 18px 20px;
      background: linear-gradient(135deg, #1e2937, #0f172a);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 24px; font-weight: bold; }
    canvas {
      width: 100%;
      display: block;
      background: #000;
    }
    .controls {
      padding: 20px;
    }
    input[type="text"], input[type="range"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      background: #1f2937;
      border: 1px solid #4b5563;
      border-radius: 10px;
      color: white;
    }
    .theme-buttons {
      display: flex;
      gap: 10px;
      margin: 15px 0;
    }
    .theme-btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn {
      width: 100%;
      padding: 16px;
      margin: 8px 0;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    .connect { background: #22c55e; color: black; }
    .publish { background: linear-gradient(90deg, #a855f7, #7e22ce); color: white; }
    .download { background: #eab308; color: black; }
    .status {
      padding: 6px 14px;
      background: #334155;
      border-radius: 30px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">📸 ShelbyVault</div>
      <div id="walletStatus" class="status">Not Connected</div>
    </div>

    <canvas id="memeCanvas" width="500" height="500"></canvas>

    <div class="controls">
      <input type="text" id="topText" placeholder="Top Text" value="Ayan" oninput="updateMeme()">
      <input type="text" id="bottomText" placeholder="Bottom Text" value="BUILD ON APTOS" oninput="updateMeme()">

      <div class="theme-buttons">
        <button class="theme-btn" style="background:linear-gradient(90deg,#3b82f6,#1e40af)" onclick="changeTheme(0)">Blue</button>
        <button class="theme-btn" style="background:linear-gradient(90deg,#f59e0b,#b91c1c)" onclick="changeTheme(1)">Sunset</button>
        <button class="theme-btn" style="background:linear-gradient(90deg,#22c55e,#166534)" onclick="changeTheme(2)">Green</button>
      </div>

      <label>Text Size: <span id="sizeValue">55</span></label>
      <input type="range" id="textSize" min="30" max="80" value="55" oninput="updateMeme(); document.getElementById('sizeValue').textContent = this.value">

      <div id="uploadArea" style="border:2px dashed #4b5563; border-radius:12px; padding:30px; text-align:center; margin:15px 0; cursor:pointer;">
        <h3>☁️ Choose Meme Image</h3>
        <p style="color:#9ca3af;">PNG, JPG or GIF</p>
      </div>
      <input type="file" id="imageUpload" accept="image/*" style="display:none;">

      <button onclick="toggleConnect()" id="connectBtn" class="btn connect">🔗 Connect Petra Wallet</button>
      <button onclick="disconnectWallet()" id="disconnectBtn" class="btn connect" style="display:none; background:#ef4444; color:white;">🚫 Disconnect</button>

      <button onclick="publishToShelby()" class="btn publish">🚀 Publish to ShelbyNet</button>
      <button onclick="downloadMeme()" class="btn download">📥 Download PNG</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('memeCanvas');
    const ctx = canvas.getContext('2d');
    let currentImage = null;
    let currentTheme = 0;
    let isConnected = false;
    let textSize = 55;

    const themes = [
      { stroke: '#000000', fill: '#ffffff' },
      { stroke: '#7f1d1d', fill: '#fcd34d' },
      { stroke: '#14532d', fill: '#86efac' }
    ];

    function loadDefault() {
      const img = new Image();
      img.src = 'https://picsum.photos/id/1015/500/500';
      img.onload = () => { currentImage = img; updateMeme(); };
    }

    function updateMeme() {
      if (!currentImage) return;
      ctx.drawImage(currentImage, 0, 0, 500, 500);

      const top = document.getElementById('topText').value;
      const bottom = document.getElementById('bottomText').value;
      textSize = parseInt(document.getElementById('textSize').value);
      const t = themes[currentTheme];

      ctx.font = `bold ${textSize}px Arial`;
      ctx.textAlign = 'center';
      ctx.strokeStyle = t.stroke;
      ctx.fillStyle = t.fill;
      ctx.lineWidth = textSize / 8;

      // Top Text
      ctx.strokeText(top.toUpperCase(), 250, 90);
      ctx.fillText(top.toUpperCase(), 250, 90);

      // Bottom Text
      ctx.strokeText(bottom.toUpperCase(), 250, 460);
      ctx.fillText(bottom.toUpperCase(), 250, 460);
    }

    function changeTheme(n) {
      currentTheme = n;
      updateMeme();
    }

    document.getElementById('uploadArea').onclick = () => document.getElementById('imageUpload').click();
    document.getElementById('imageUpload').onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => { currentImage = img; updateMeme(); };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      }
    };

    function toggleConnect() {
      isConnected = true;
      document.getElementById('walletStatus').textContent = "0xa1b2...xy9z";
      document.getElementById('connectBtn').style.display = 'none';
      document.getElementById('disconnectBtn').style.display = 'block';
      alert("✅ Petra Wallet Connected Successfully!");
    }

    function disconnectWallet() {
      isConnected = false;
      document.getElementById('walletStatus').textContent = "Not Connected";
      document.getElementById('connectBtn').style.display = 'block';
      document.getElementById('disconnectBtn').style.display = 'none';
    }

    function publishToShelby() {
      if (!isConnected) {
        alert("প্রথমে Petra Wallet Connect করুন!");
        return;
      }
      alert("🚀 Congratulations!\n\nYour meme has been published to Shelby Testnet!");
    }

    function downloadMeme() {
      const link = document.createElement('a');
      link.download = 'Ayan-Shelby-Meme.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    loadDefault();
  </script>
</body>
</html>
