<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayan1816 | Terminal</title>
    <style>
        body {
            background-color: #0d1117;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            font-size: 16px;
            overflow-x: hidden;
        }
        #terminal {
            max-width: 800px;
            margin: 0 auto;
        }
        .output {
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .command-line {
            display: flex;
            align-items: center;
        }
        .prompt {
            color: #00ffff;
            margin-right: 10px;
        }
        input {
            background-color: transparent;
            border: none;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            outline: none;
            flex-grow: 1;
            caret-color: #00ff00;
        }
        a {
            color: #ff00ff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .highlight { color: #f85d7f; }
    </style>
</head>
<body>
    <div id="terminal">
        <div class="output">
            Welcome to Ayan's Terminal Portfolio.<br>
            Type <span class="highlight">'help'</span> to see a list of available commands.
        </div>
        <div id="history"></div>
        <div class="command-line">
            <span class="prompt">visitor@ayan1816:~$</span>
            <input type="text" id="cmd" autocomplete="off" autofocus>
        </div>
    </div>

    <script>
        const input = document.getElementById('cmd');
        const history = document.getElementById('history');

        const commands = {
            help: "Available commands:<br>  <span class='highlight'>about</span>    - Who is Ayan?<br>  <span class='highlight'>projects</span> - View my Web3 & AI builds<br>  <span class='highlight'>skills</span>   - My tech stack<br>  <span class='highlight'>socials</span>  - Connect with me<br>  <span class='highlight'>clear</span>    - Clear the terminal screen",
            
            about: "Hi, I'm Ayan! 👋<br>I am a Full-Stack Web3 & AI Infrastructure Architect.<br>I specialize in developing client-side decentralized applications (dApps) that bridge the gap between AI data security and blockchain immutability.",
            
            projects: "<br><b>1. 🛡️ Shelby Vault v2.0</b><br>Decentralized AI Data Hub built on Aptos. Features zero-knowledge AES-256 encryption and Real-Time JSON Prompt Validator.<br><br><b>2. 💳 PulsePay Arc</b><br>Next-Gen Crypto Payment Gateway designed for frictionless, low-latency Web3 micro-transactions.<br><br><i>Type 'socials' to find my GitHub and see the code!</i>",
            
            skills: "<b>Blockchain:</b> Aptos (Move), Ethereum, Solidity, Web3.js<br><b>Frontend:</b> React.js, Next.js, Tailwind CSS<br><b>Infrastructure:</b> IPFS, Pinata, Shelby S3 Pipeline",
            
            socials: "<b>Twitter:</b> <a href='https://x.com/ayan_ar65' target='_blank'>@ayan_ar65</a><br><b>LinkedIn:</b> <a href='https://www.linkedin.com/in/md-mohin-b6a4912b9' target='_blank'>Ayan (Md Mohin)</a><br><b>Discord:</b> Ayan1816",
        };

        input.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                let cmdValue = input.value.trim().toLowerCase();
                let response = "";

                if (cmdValue === "clear") {
                    history.innerHTML = "";
                    input.value = "";
                    return;
                }

                if (commands[cmdValue]) {
                    response = commands[cmdValue];
                } else if (cmdValue !== "") {
                    response = `Command not found: ${cmdValue}. Type 'help' for available commands.`;
                }

                history.innerHTML += `<div class="command-line"><span class="prompt">visitor@ayan1816:~$</span> ${input.value}</div>`;
                if (response !== "") {
                    history.innerHTML += `<div class="output">${response}</div><br>`;
                }
                
                input.value = "";
                window.scrollTo(0, document.body.scrollHeight);
            }
        });

        document.addEventListener('click', () => input.focus());
    </script>
</body>
</html>
