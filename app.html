<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShelbyVault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { background-color: #0b0f19; color: #ffffff; } </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <!-- Main App Container -->
    <div class="w-full max-w-md p-6 bg-[#111827] border border-gray-800 rounded-2xl shadow-2xl">
        <div class="flex items-center justify-between mb-6">
            <span class="text-lg font-bold">ShelbyVault</span>
            <button id="walletBtn" onclick="toggleWallet()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-bold">
                Connect Petra
            </button>
        </div>

        <!-- Meme Upload Box -->
        <div class="border-2 border-dashed border-gray-600 p-8 rounded-xl text-center mb-6">
            <p>Choose Meme Image</p>
            <p class="text-xs text-gray-400">PNG, JPG or GIF up to 10MB</p>
        </div>

        <input type="text" placeholder="Enter a funny caption.." class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg mb-4 text-white">

        <button class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-lg font-bold">
            Publish to ShelbyNet (Testnet)
        </button>
    </div>

    <script>
        async function toggleWallet() {
            const btn = document.getElementById('walletBtn');
            
            // চেক করা হচ্ছে ব্রাউজারে অ্যাপটোস ওয়ালেট আছে কি না
            if (typeof window.aptos !== 'undefined') {
                try {
                    // কানেক্ট করার অনুরোধ
                    const account = await window.aptos.connect();
                    
                    // সফল হলে বাটন টেক্সট ও কালার আপডেট
                    if (account && account.address) {
                        btn.innerText = account.address.substring(0, 6) + "..." + account.address.substring(account.address.length - 4);
                        btn.classList.remove('bg-red-500', 'hover:bg-red-600');
                        btn.classList.add('bg-green-600', 'hover:bg-green-700');
                    }
                } catch (err) {
                    console.error("Connection rejected:", err);
                    alert("ওয়ালেট কানেকশন বিফল হয়েছে! দয়া করে ওয়ালেটটি আনলক করুন অথবা পারমিশন দিন।");
                }
            } else {
                alert("পেট্রা ওয়ালেট ডিটেক্ট করা যাচ্ছে না। দয়া করে Misses ব্রাউজারে পেট্রা এক্সটেনশনটি ওপেন রাখুন।");
            }
        }
    </script>
</body>
</html>
