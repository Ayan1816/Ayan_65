<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShelbyVault - Ayan Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #0d0e12; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { max-width: 500px; width: 100%; background: #161820; border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .header { padding: 15px 20px; background: linear-gradient(90deg, #1e3a8a, #0d9488); border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        canvas { width: 100%; display: block; background: #000; border-radius: 8px; margin-bottom: 20px; }
        .controls { display: flex; flex-direction: column; gap: 12px; }
        input[type="text"], input[type="range"] { width: 100%; padding: 12px; background: #1f2937; border: 1px solid #374151; border-radius: 6px; color: white; font-size: 16px; }
        .theme-buttons { display: flex; gap: 8px; margin: 5px 0; }
        .theme-btn { flex: 1; padding: 14px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .theme-btn:hover { opacity: 0.9; }
        .btn { width: 100%; padding: 16px; margin-top: 8px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; }
        .connect { background: #3b82f6; color: white; }
        .connect:hover { background: #2563eb; }
        .disconnect { background: #dc2626; color: white; }
        .publish { background: #2563eb; color: white; }
        .download { background: #4b5563; color: white; }
        .status-container { display: flex; flex-direction: column; align-items: flex-end; font-size: 14px; }
        .network-tag { background: #1e293b; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-top: 4px; color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <div>
            <div style="font-size: 20px; font-weight: bold;">SHELBY</div>
            <div style="font-size: 12px; color: #9ca3af;">Meme Studio</div>
        </div>
        <div class="status-container">
            <button onclick="handleWalletAction()" id="walletBtn" class="theme-btn connect" style="padding: 8px 16px; flex: none; font-size: 14px;">Connect Wallet</button>
            <span id="networkStatus" class="network-tag">Network: Offline</span>
        </div>
    </div>

    <canvas id="memeCanvas" width="500" height="500"></canvas>

    <div class="controls">
        <input type="text" id="topText" value="SHELBY IS HOT" oninput="updateMeme()">
        <input type="text" id="bottomText" value="AWS IS COLD" oninput="updateMeme()">

        <div class="theme-buttons">
            <button class="theme-btn" style="background: #3b82f6;" onclick="changeTheme(0)">Blue</button>
            <button class="theme-btn" style="background: #ef4444;" onclick="changeTheme(1)">Sunset</button>
            <button class="theme-btn" style="background: #22c55e;" onclick="changeTheme(2)">Green</button>
        </div>

        <div id="uploadArea" style="border: 2px dashed #4b5563; border-radius: 8px; padding: 15px; text-align: center; margin: 5px 0; cursor: pointer; background: #1f2937;">
            <p style="color: #9ca3af; margin: 0;">Upload Bg</p>
        </div>
        <input type="file" id="imageUpload" accept="image/*" style="display: none;">

        <button onclick="downloadMeme()" class="btn download">Download PNG</button>
        <button onclick="publishToShelby()" class="btn publish">Publish to Shelby (Testnet Tx)</button>
    </div>
</div>

<script>
const canvas = document.getElementById('memeCanvas');
const ctx = canvas.getContext('2d');
let currentImage = null;
let currentTheme = 0;
let accountAddress = null;

const themes = [
    { stroke: '#000', fill: '#fff' },
    { stroke: '#fff', fill: '#f97316' },
    { stroke: '#fff', fill: '#22c55e' }
];

function loadDefault() {
    const img = new Image();
    img.src = 'https://picsum.photos/id/1015/500/500';
    img.onload = () => {
        currentImage = img;
        updateMeme();
    };
}

function updateMeme() {
    if (!currentImage) return;
    ctx.drawImage(currentImage, 0, 0, 500, 500);

    const top = document.getElementById('topText').value || 'SHELBY IS HOT';
    const bottom = document.getElementById('bottomText').value || 'AWS IS COLD';
    const t = themes[currentTheme];

    ctx.font = `bold 45px Arial`;
    ctx.textAlign = 'center';
    ctx.strokeStyle = t.stroke;
    ctx.fillStyle = t.fill;
    ctx.lineWidth = 6;

    ctx.strokeText(top.toUpperCase(), 250, 80);
    ctx.fillText(top.toUpperCase(), 250, 80);
    ctx.strokeText(bottom.toUpperCase(), 250, 440);
    ctx.fillText(bottom.toUpperCase(), 250, 440);
}

function changeTheme(i) {
    currentTheme = i;
    updateMeme();
}

document.getElementById('uploadArea').onclick = () => document.getElementById('imageUpload').click();
document.getElementById('imageUpload').onchange = (e) => {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
                currentImage = img;
                updateMeme();
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    }
};

// ==================== ভিডিও স্ট্যান্ডার্ড অনুযায়ী ফাইনাল ওয়ালেট লজিক ====================

// অ্যাপ্টস ওয়ালেট স্ট্যান্ডার্ড (AIP-62) খুঁজে বের করার সবচেয়ে আধুনিক গাইডলাইন
function getStandardPetraWallet() {
    // ১. গ্লোবাল রেজিস্ট্রি থেকে অন-ডিমান্ড খোঁজা
    if (window.__aptosWallets && window.__aptosWallets.length > 0) {
        const standardPetra = window.__aptosWallets.find(w => w.name.toLowerCase().includes('petra'));
        if (standardPetra) return standardPetra;
    }
    
    // ২. যদি ব্রাউজার ওল্ড বা ইন-অ্যাপ হয় তবে এটি ব্যাকআপ প্রোভাইডার
    if (window.aptos && window.aptos.features) return window.aptos;
    if (window.petra) return window.petra;
    
    return null;
}

async function handleWalletAction() {
    const walletBtn = document.getElementById('walletBtn');
    
    // যদি অলরেডি কানেক্টেড থাকে, তবে ভিডিওর মতো ডিসকানেক্ট করে দেবে
    if (accountAddress) {
        try {
            const wallet = getStandardPetraWallet();
            if (wallet && wallet.disconnect) {
                await wallet.disconnect();
            } else if (wallet && wallet.features && wallet.features['aptos:disconnect']) {
                await wallet.features['aptos:disconnect'].disconnect();
            }
        } catch (e) {
            console.log("Disconnect error:", e);
        }
        
        accountAddress = null;
        walletBtn.innerText = "Connect Wallet";
        walletBtn.className = "theme-btn connect";
        document.getElementById('networkStatus').innerText = "Network: Offline";
        document.getElementById('networkStatus').style.color = "#38bdf8";
        return;
    }

    // কানেক্ট করার ফ্রেশ সেশন শুরু
    try {
        const wallet = getStandardPetraWallet();
        
        if (!wallet) {
            alert("Petra Wallet ডিটেক্ট করা যায়নি!\n\n💡 দয়া করে Mises ব্রাউজারের Extension অপশন থেকে Petra ওয়ালেটটি পাসওয়ার্ড দিয়ে আনলক করে পেজটি রিফ্রেশ দিন।");
            return;
        }

        walletBtn.innerText = "Connecting...";

        let connectionResponse;
        
        // ভিডিওর কোড স্টাইল: স্ট্যান্ডার্ড ফিচারের মাধ্যমে কানেক্ট করা
        if (wallet.features && wallet.features['aptos:connect']) {
            connectionResponse = await wallet.features['aptos:connect'].connect();
        } else {
            // জেনারেল মেথড ফলব্যাক
            connectionResponse = await wallet.connect();
        }

        // সফলভাবে ডেটা রিট্রিভ করা
        const account = connectionResponse.account || connectionResponse;
        accountAddress = account.address || account;

        if (accountAddress) {
            // ভিডিওর মতো হুবহু অ্যাড্রেস ফরম্যাট করা (যেমন: 0x51f1...2c5e)
            const formattedAddr = `${accountAddress.slice(0, 6)}...${accountAddress.slice(-4)}`;
            walletBtn.innerText = formattedAddr;
            walletBtn.className = "theme-btn disconnect";
            
            // নেটওয়ার্ক টেস্টনেট আপডেট
            document.getElementById('networkStatus').innerText = "Network: testnet";
            document.getElementById('networkStatus').style.color = "#22c55e";
        }
    } catch (err) {
        console.error("Wallet Connection Error:", err);
        walletBtn.innerText = "Connect Wallet";
        walletBtn.className = "theme-btn connect";
        alert("কানেকশন ক্যানসেল বা রিজেক্ট করা হয়েছে। নিশ্চিত করুন আপনার Petra Wallet-টি এক্সটেনশনে আনলকড আছে।");
    }
}

async function publishToShelby() {
    if (!accountAddress) {
        alert("Please connect your Petra Wallet first!");
        return;
    }
    
    try {
        const wallet = getStandardPetraWallet();
        if (!wallet) return;

        // ভিডিওর মতো টেস্টনেট মেম ট্রানজেকশন ইনিশিয়েট করা
        alert("Uploading to Aptos Testnet... দয়া করে ওয়ালেট পপ-আপে Approve করুন।");
        
        // ভিডিওর সোর্স কোড অনুযায়ী স্ট্যান্ডার্ড পে-লোড স্ট্রাকচার
        const transactionPayload = {
            data: {
                function: "0x1::coin::transfer",
                typeArguments: ["0x1::aptos_coin::AptosCoin"],
                functionArguments: [accountAddress, "1000"] // টেস্ট ট্রানজেকশন
            }
        };

        let txResult;
        
        // AIP-62 স্ট্যান্ডার্ড অনুযায়ী সাইন এবং সাবমিট করা
        if (wallet.features && wallet.features['aptos:signAndSubmitTransaction']) {
            txResult = await wallet.features['aptos:signAndSubmitTransaction'].signAndSubmitTransaction({ 
                payload: transactionPayload.data 
            });
        } else {
            txResult = await wallet.signAndSubmitTransaction(transactionPayload);
        }

        if (txResult) {
            const hash = txResult.hash || txResult;
            alert(`Succeed! Transaction confirmed on Aptos Testnet.\nHash: ${hash}`);
        }
    } catch (error) {
        console.error("Transaction Error:", error);
        alert("Testnet transaction failed or was cancelled!");
    }
}

function downloadMeme() {
    const link = document.createElement('a');
    link.download = 'ayan-shelby-meme.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
}

loadDefault();
</script>

</body>
</html>
