<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelby Vault - Decentralized Meme Storage</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
        }

        .btn-wallet {
            background: #ed4c5c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-wallet.connected {
            background: #10b981;
        }

        .btn-wallet.disconnect-mode {
            background: #ef4444 !important;
        }

        .upload-section {
            border: 2px dashed #374151;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: #1f2937;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .btn-publish {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8, #0369a1);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .preview-box {
            display: none;
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="logo">
                <i class="fa-solid fa-vault"></i> ShelbyVault
            </div>
            <button class="btn-wallet" id="walletBtn" onclick="handleWalletAction()">Connect Petra</button>
        </div>

        <div class="upload-section" onclick="triggerFileInput()">
            <i class="fa-solid fa-cloud-arrow-up" style="font-size: 40px; color: #9ca3af; margin-bottom: 12px;"></i>
            <p style="font-weight: 600; margin-bottom: 4px;">Choose Meme Image</p>
            <p style="font-size: 12px; color: #9ca3af;">PNG, JPG or GIF up to 10MB</p>
            <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="previewImage(event)">
            <img id="imagePreview" class="preview-box" alt="Preview">
        </div>

        <div class="input-group">
            <label for="caption">Meme Caption / Description</label>
            <input type="text" id="caption" class="input-field" placeholder="Enter a funny caption...">
        </div>

        <button class="btn-publish" onclick="publishMeme()">
            <i class="fa-solid fa-rocket"></i> Publish to ShelbyNet (Testnet)
        </button>
    </div>

    <script>
        let userAptosAddress = null;
        let isConnected = false;

        // ওয়ালেট প্রোভাইডার চেক করার নিরাপদ গ্লোবাল ফাংশন
        function getWalletProvider() {
            if (window.petra) return window.petra;
            if (window.aptos) return window.aptos;
            return null;
        }

        // পেজ লোড হওয়া মাত্রই ওয়ালেটের অবস্থা চেক করার অটো লুপ
        window.addEventListener('load', () => {
            let checkCount = 0;
            const interval = setInterval(async () => {
                const wallet = getWalletProvider();
                checkCount++;
                
                if (wallet) {
                    clearInterval(interval);
                    try {
                        const alreadyConnected = await wallet.isConnected();
                        if (alreadyConnected) {
                            const account = await wallet.account();
                            if (account && account.address) {
                                setupConnectedUI(account.address);
                            }
                        }
                    } catch (e) {
                        console.log("Auto-detect check skipped or wallet locked.");
                    }
                }
                
                if (checkCount > 10) clearInterval(interval); // ১০ বার ট্রাই করে বন্ধ হবে
            }, 300);
        });

        // বোতামে ক্লিক করলে এই ফাংশনটি রান করবে
        async function handleWalletAction() {
            const wallet = getWalletProvider();
            
            if (!wallet) {
                alert("Petra ওয়ালেট খুঁজে পাওয়া যায়নি। দয়া করে নিশ্চিত করুন আপনি Petra অ্যাপের ভেতরের ব্রাউজার ট্যাবটি ব্যবহার করছেন।");
                return;
            }

            if (isConnected) {
                // ডিসকানেক্ট লজিক
                try {
                    if (typeof wallet.disconnect === "function") {
                        await wallet.disconnect();
                    }
                    resetWalletUI();
                    alert("ওয়ালেট সফলভাবে ডিসকানেক্ট করা হয়েছে।");
                } catch (error) {
                    console.error("Disconnect error:", error);
                    resetWalletUI(); // কোনো কারণে ইন্টারনাল এরর হলেও ইউজার এন্ডে ডিসকানেক্ট করে দেবে
                }
            } else {
                // কানেক্ট লজিক
                try {
                    // সরাসরি কানেক্ট উইন্ডো পপ-আপ রিকোয়েস্ট
                    await wallet.connect();
                    const account = await wallet.account();
                    
                    if (account && account.address) {
                        setupConnectedUI(account.address);
                        
                        // নেটওয়ার্ক টেস্টনেটে নেওয়া নিশ্চিত করা
                        try {
                            if (typeof wallet.changeNetwork === "function") {
                                await wallet.changeNetwork("Testnet");
                            }
                        } catch(nErr) {
                            console.log("Network automated switch standard.");
                        }

                        alert("Aptos Testnet ওয়ালেট সফলভাবে কানেক্ট হয়েছে!");
                    } else {
                        alert("ওয়ালেট অ্যাকাউন্ট ইনফো পাওয়া যায়নি।");
                    }
                } catch (error) {
                    console.error("Connection failed:", error);
                    alert("কানেকশন রিকোয়েস্ট রেসপন্স করেনি। দয়া করে পেজটি একবার রিফ্রেশ দিয়ে আবার চেষ্টা করুন।");
                }
            }
        }

        function setupConnectedUI(address) {
            userAptosAddress = address;
            isConnected = true;
            const walletBtn = document.getElementById('walletBtn');
            const shortAddr = address.substring(0, 6) + "..." + address.substring(address.length - 4);
            
            walletBtn.innerText = shortAddr;
            walletBtn.className = "btn-wallet connected";

            // মাউস বা টাচ ওভার ইফেক্ট (ডিসকানেক্ট টেক্সট দেখানোর জন্য)
            walletBtn.onmouseover = function() {
                this.innerText = "Disconnect ❌";
                this.classList.add('disconnect-mode');
            };
            walletBtn.onmouseout = function() {
                if(isConnected) {
                    this.innerText = shortAddr;
                    this.classList.remove('disconnect-mode');
                }
            };
        }

        function resetWalletUI() {
            userAptosAddress = null;
            isConnected = false;
            const walletBtn = document.getElementById('walletBtn');
            walletBtn.innerText = "Connect Petra";
            walletBtn.className = "btn-wallet";
            walletBtn.onmouseover = null;
            walletBtn.onmouseout = null;
        }

        function triggerFileInput() {
            document.getElementById('fileInput').click();
        }

        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('imagePreview');
                output.src = reader.result;
                output.style.display = 'block';
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        function publishMeme() {
            if (!userAptosAddress) {
                alert("দয়া করে প্রথমে ওয়ালেট কানেক্ট করুন!");
                return;
            }
            alert("আপনার টেস্টনেট অ্যাকাউন্টটি প্রস্তুত আছে। ছবি আপলোড সফল করতে পরবর্তী ধাপে Pinata IPFS API Key কনফিগার করতে হবে।");
        }
    </script>
</body>
</html>
