<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShelbyVault - Meme Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0a14;
      color: white;
      padding: 15px;
      min-height: 100vh;
    }
    .container {
      max-width: 480px;
      margin: auto;
      background: #111827;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .header {
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1f2937;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: bold;
    }
    .connect-btn {
      background: #ef4444;
      color: white;
      padding: 8px 16px;
      border-radius: 9999px;
      font-weight: bold;
      border: none;
    }
    .upload-area {
      margin: 20px;
      border: 2px dashed #4b5563;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      background: #1f2937;
    }
    .upload-area:hover {
      border-color: #60a5fa;
    }
    .caption-input {
      margin: 0 20px 20px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      background: #374151;
      border: 1px solid #4b5563;
      border-radius: 8px;
      color: white;
      font-size: 16px;
    }
    .publish-btn {
      margin: 10px 20px 25px;
      width: calc(100% - 40px);
      padding: 16px;
      background: linear-gradient(90deg, #3b82f6, #2563eb);
      color: white;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    canvas {
      width: 100%;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <span style="font-size:24px;">📸</span>
        <span>ShelbyVault</span>
      </div>
      <button class="connect-btn" onclick="connectWallet()">Connect Aptos</button>
    </div>

    <!-- Meme Preview -->
    <canvas id="memeCanvas" width="500" height="500"></canvas>

    <!-- Upload -->
    <div class="upload-area" onclick="document.getElementById('imageUpload').click()">
      <h2>☁️</h2>
      <p><strong>Choose Meme Image</strong></p>
      <p style="color:#9ca3af; font-size:14px;">PNG, JPG or GIF up to 10MB</p>
    </div>
    <input type="file" id="imageUpload" accept="image/*" style="display:none;">

    <!-- Caption -->
    <div class="caption-input">
      <input type="text" id="caption" placeholder="Enter a funny caption..." oninput="updateMeme()">
    </div>

    <!-- Publish Button -->
    <button class="publish-btn" onclick="publishToShelby()">
      🚀 Publish to ShelbyNet
    </button>
  </div>

  <script>
    const canvas = document.getElementById('memeCanvas');
    const ctx = canvas.getContext('2d');
    let currentImage = null;

    // Default Image
    function loadDefault() {
      const img = new Image();
      img.src = 'https://picsum.photos/id/1015/500/500';
      img.onload = () => {
        currentImage = img;
        updateMeme();
      };
    }

    function updateMeme() {
      if (!currentImage) return;
      ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);

      const text = document.getElementById('caption').value || "JUBAYIR69";
      
      ctx.font = 'bold 48px Arial';
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 6;
      ctx.textAlign = 'center';
      
      ctx.strokeText(text.toUpperCase(), canvas.width/2, canvas.height - 80);
      ctx.fillText(text.toUpperCase(), canvas.width/2, canvas.height - 80);
    }

    // Image Upload
    document.getElementById('imageUpload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            currentImage = img;
            updateMeme();
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    function connectWallet() {
      alert("✅ Petra Wallet Connecting...\n\n(এখনো Demo)");
    }

    function publishToShelby() {
      alert("🚀 Meme Published to ShelbyNet!\n\nTransaction Simulated.");
    }

    // Start
    loadDefault();
  </script>
</body>
</html>
