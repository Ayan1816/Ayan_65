<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shelby Meme Studio - JUBAYIR69</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0a14;
      color: white;
      padding: 15px;
      min-height: 100vh;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 24px;
      background: linear-gradient(90deg, #ff00ff, #00ffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .main {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 1000px;
      margin: auto;
    }
    .preview {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid #333;
    }
    #memeCanvas {
      width: 100%;
      height: auto;
      display: block;
    }
    .controls {
      background: #111827;
      padding: 20px;
      border-radius: 12px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: #1f2937;
      border: 1px solid #4b5563;
      border-radius: 8px;
      color: white;
      font-size: 16px;
    }
    .theme-buttons {
      display: flex;
      gap: 10px;
      margin: 15px 0;
    }
    .color-btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      color: white;
      cursor: pointer;
    }
    .blue { background: linear-gradient(135deg, #3b82f6, #1e40af); }
    .sunset { background: linear-gradient(135deg, #f97316, #dc2626); }
    .green { background: linear-gradient(135deg, #22c55e, #15803d); }

    button.publish {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      background: linear-gradient(90deg, #c026d3, #db2777);
      border: none;
      border-radius: 10px;
      color: white;
      margin-top: 15px;
      cursor: pointer;
    }
    button.download {
      width: 100%;
      padding: 12px;
      background: #22c55e;
      color: black;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>🚀 Shelby Meme Studio (JUBAYIR69 Edition)</h1>
  
  <div class="main">
    <div class="preview">
      <canvas id="memeCanvas" width="600" height="600"></canvas>
    </div>

    <div class="controls">
      <input type="text" id="topText" placeholder="Top Text" value="JUBAYIR69" oninput="updateMeme()">
      <input type="text" id="bottomText" placeholder="Bottom Text" value="AWS IS COLD" oninput="updateMeme()">

      <h3>Theme / Color</h3>
      <div class="theme-buttons">
        <button class="color-btn blue" onclick="changeTheme(0)">Blue</button>
        <button class="color-btn sunset" onclick="changeTheme(1)">Sunset</button>
        <button class="color-btn green" onclick="changeTheme(2)">Green</button>
      </div>

      <input type="file" id="imageUpload" accept="image/*">

      <button class="download" onclick="downloadMeme()">📥 Download PNG</button>
      <button class="publish" onclick="publishToShelby()">🚀 Publish to Shelby (Testnet)</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('memeCanvas');
    const ctx = canvas.getContext('2d');
    let currentImage = null;
    let currentTheme = 0;

    const themes = [
      { textColor: '#ffffff', strokeColor: '#000000' },
      { textColor: '#fcd34d', strokeColor: '#b91c1c' },
      { textColor: '#86efac', strokeColor: '#166534' }
    ];

    function updateMeme() {
      if (!currentImage) return;
      
      ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
      
      const topText = document.getElementById('topText').value;
      const bottomText = document.getElementById('bottomText').value;
      const theme = themes[currentTheme];

      // Top Text
      ctx.font = 'bold 55px Arial';
      ctx.fillStyle = theme.textColor;
      ctx.strokeStyle = theme.strokeColor;
      ctx.lineWidth = 8;
      ctx.textAlign = 'center';
      ctx.strokeText(topText, canvas.width/2, 90);
      ctx.fillText(topText, canvas.width/2, 90);

      // Bottom Text
      ctx.strokeText(bottomText, canvas.width/2, canvas.height - 70);
      ctx.fillText(bottomText, canvas.width/2, canvas.height - 70);
    }

    // Image Upload
    document.getElementById('imageUpload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            currentImage = img;
            updateMeme();
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });
