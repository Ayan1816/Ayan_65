<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShelbyVault - Ayan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0a14;
      color: white;
      padding: 15px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: #111827;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    .header {
      padding: 16px 20px;
      background: #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 22px; font-weight: bold; }
    canvas {
      width: 100%;
      display: block;
      background: #000;
    }
    .upload-area {
      margin: 20px;
      border: 2px dashed #4b5563;
      border-radius: 12px;
      padding: 50px 20px;
      text-align: center;
      cursor: pointer;
    }
    input[type="text"] {
      width: calc(100% - 40px);
      margin: 0 20px 15px;
      padding: 14px;
      background: #374151;
      border: 1px solid #4b5563;
      border-radius: 8px;
      color: white;
    }
    .btn {
      width: calc(100% - 40px);
      margin: 8px 20px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    .connect-btn { background: #ef4444; color: white; }
    .publish-btn { background: linear-gradient(90deg, #3b82f6, #2563eb); color: white; }
    .download-btn { background: #22c55e; color: black; }
    .status {
      font-size: 13px;
      padding: 5px 12px;
      background: #334155;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">📸 ShelbyVault - Ayan</div>
      <div id="walletStatus" class="status">Not Connected</div>
    </div>

    <canvas id="memeCanvas" width="500" height="500"></canvas>

    <div class="upload-area" id="uploadArea">
      <h2>☁️</h2>
      <p><strong>Choose Meme Image</strong></p>
      <p style="color:#9ca3af; font-size:14px;">PNG, JPG or GIF up to 10MB</p>
    </div>

    <input type="file" id="imageUpload" accept="image/*" style="display:none;">

    <input type="text" id="caption" placeholder="Enter your caption..." value="Ayan" oninput="updateMeme()">

    <button onclick="connectPetra()" id="connectBtn" class="btn connect-btn">🔗 Connect Petra Wallet</button>
    <button onclick="disconnectWallet()" id="disconnectBtn" class="btn connect-btn" style="display:none; background:#ef4444;">🚫 Disconnect</button>

    <button onclick="publishToShelby()" class="btn publish-btn">🚀 Publish to ShelbyNet (Testnet)</button>
    <button onclick="downloadMeme()" class="btn download-btn">📥 Download PNG</button>
  </div>

  <script>
    const canvas = document.getElementById('memeCanvas');
    const ctx = canvas.getContext('2d');
    let currentImage = null;
    let accountAddress = null;

    function loadDefault() {
      const img = new Image();
      img.src = 'https://picsum.photos/id/1015/500/500';
      img.onload = () => { currentImage = img; updateMeme(); };
    }

    function updateMeme() {
      if (!currentImage) return;
      ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);

      const text = document.getElementById('caption').value || "Ayan";
      ctx.font = 'bold 55px Arial';
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 8;
      ctx.textAlign = 'center';

      ctx.strokeText(text.toUpperCase(), canvas.width/2, canvas.height - 80);
      ctx.fillText(text.toUpperCase(), canvas.width/2, canvas.height - 80);
    }

    // Upload
    document.getElementById('uploadArea').onclick = () => document.getElementById('imageUpload').click();
    document.getElementById('imageUpload').onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => { currentImage = img; updateMeme(); };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      }
    };

    // Improved Wallet Connect
    async function connectPetra() {
      try {
        if (typeof window.aptos !== 'undefined') {
          const response = await window.aptos.connect();
          accountAddress = response.address;
          
          document.getElementById('walletStatus').textContent = accountAddress.slice(0,6) + "..." + accountAddress.slice(-4);
          document.getElementById('connectBtn').style.display = 'none';
          document.getElementById('disconnectBtn').style.display = 'block';
          
          alert("✅ Petra Wallet সফলভাবে কানেক্ট হয়েছে!");
        } 
        else if (typeof window.petras !== 'undefined') {
          // Alternative for some mobile versions
          const response = await window.petras.connect();
          accountAddress = response.address;
          // same UI update...
          alert("✅ Connected via Petras!");
        }
        else {
          alert("❌ Petra Wallet পাওয়া যায়নি।\n\nমোবাইলে Petra Wallet অ্যাপ খুলে দিয়ে আবার চেষ্টা করুন।");
        }
      } catch (error) {
        console.error(error);
        alert("Connect করতে সমস্যা হয়েছে।\n\nPetra Wallet সক্রিয় আছে কিনা চেক করুন।");
      }
    }

    function disconnectWallet() {
      accountAddress = null;
      document.getElementById('walletStatus').textContent = "Not Connected";
      document.getElementById('connectBtn').style.display = 'block';
      document.getElementById('disconnectBtn').style.display = 'none';
    }

    function publishToShelby() {
      if (!accountAddress) {
        alert("প্রথমে Petra Wallet Connect করুন!");
        return;
      }
      alert(`✅ Meme Published on ShelbyNet!\nWallet: ${accountAddress}`);
    }

    function downloadMeme() {
      const link = document.createElement('a');
      link.download = 'Ayan-Meme.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    loadDefault();
  </script>
</body>
</html>
