<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShelbyVault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { background-color: #0b0f19; color: #ffffff; } </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <!-- Main App Container -->
    <div class="w-full max-w-md bg-[#111827] border border-gray-800 rounded-2xl shadow-2xl p-6">
        <div class="flex items-center justify-between mb-6">
            <span class="text-lg font-bold">ShelbyVault</span>
            <!-- বাটন আইডি এবং ফাংশন নাম আপডেট করা হয়েছে -->
            <button id="connectBtn" onclick="handleWalletClick()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded">
                Connect Petra
            </button>
        </div>

        <!-- Meme Upload Box -->
        <div class="border-2 border-dashed border-gray-600 p-8 rounded-xl text-center mb-6">
            <p>Choose Meme Image</p>
            <p class="text-xs text-gray-400">PNG, JPG or GIF up to 10MB</p>
        </div>

        <input type="text" placeholder="Enter a funny caption.." class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg mb-4 text-white">

        <button class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-lg font-bold">
            Publish to ShelbyNet (Testnet)
        </button>
    </div>

    <script>
        async function handleWalletClick() {
            const btn = document.getElementById("connectBtn");

            // ওয়ালেট কানেক্টেড আছে কি না চেক করছে
            const isConnected = await window.aptos.isConnected();

            if (isConnected) {
                // ডিসকানেক্ট করার কোড
                await window.aptos.disconnect();
                btn.innerText = "Connect Petra";
            } else {
                // কানেক্ট করার কোড
                try {
                    if (window.aptos) {
                        await window.aptos.connect();
                        const account = await window.aptos.account();
                        // অ্যাড্রেস শর্ট করে দেখাচ্ছে
                        btn.innerText = account.address.substring(0, 6) + "...";
                    } else {
                        alert("Petra Wallet not found!");
                    }
                } catch (error) {
                    console.error(error);
                    alert("ওয়ালেট কানেকশন বিফল হয়েছে! অনুগ্রহ করে ওয়ালেটটি আনলক করুন অথবা পারমিশন দিন।");
                }
            }
        }
    </script>
</body>
</html>
