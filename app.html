<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ShelbyVault</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f19] text-white flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-[#111827] p-6 rounded-2xl shadow-2xl border border-gray-800">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold">ShelbyVault</h1>
            <!-- কানেক্ট বাটন -->
            <button id="connectBtn" onclick="connectPetra()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg font-bold">
                Connect Wallet
            </button>
        </div>
        <p class="text-gray-400 text-center">Your secure meme hub</p>
    </div>

    <script>
        async function connectPetra() {
            const btn = document.getElementById("connectBtn");

            // ১. চেক করা হচ্ছে পেট্রা ওয়ালেট আছে কি না
            if (!window.aptos) {
                alert("আপনার ব্রাউজারে Petra Wallet এক্সটেনশনটি পাওয়া যায়নি। দয়া করে সেটি ইনস্টল করুন।");
                return;
            }

            try {
                // ২. কানেক্ট করার চেষ্টা
                await window.aptos.connect();
                
                // ৩. একাউন্ট ডিটেইলস নেয়া
                const account = await window.aptos.account();
                
                // ৪. বাটনের টেক্সট পরিবর্তন
                btn.innerText = account.address.substring(0, 6) + "..." + account.address.substring(account.address.length - 4);
                btn.style.backgroundColor = "#059669"; // সবুজ রঙ
                
            } catch (error) {
                console.log(error);
                alert("কানেক্ট করা যাচ্ছে না। দয়া করে আপনার ওয়ালেটটি আনলক করুন এবং পারমিশন দিন।");
            }
        }
    </script>
</body>
</html>
