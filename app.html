<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShelbyVault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { background-color: #0a0f24; color: #ffffff; } </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <!-- Main Container - আগের ডিজাইন অনুযায়ী -->
    <div class="w-full max-w-md bg-[#111827] border border-gray-800 rounded-2xl shadow-2xl p-6 m-4">
        <div class="flex items-center justify-between mb-6">
            <span class="text-lg font-bold">ShelbyVault</span>
            <button id="connectBtn" onclick="connectPetra()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-bold transition-all">
                Connect Wallet
            </button>
        </div>

        <div class="border-2 border-dashed border-gray-600 p-8 rounded-xl text-center mb-6">
            <p>Choose Meme Image</p>
            <p class="text-xs text-gray-400">PNG, JPG or GIF up to 10MB</p>
        </div>

        <input type="text" placeholder="Enter a funny caption.." class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg mb-4 text-white">

        <button class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-lg font-bold">
            Publish to ShelbyNet (Testnet)
        </button>
        <p class="text-center text-gray-500 text-xs mt-4">Your secure meme hub</p>
    </div>

    <script>
        async function connectPetra() {
            const btn = document.getElementById("connectBtn");

            if (!window.aptos) {
                alert("Petra Wallet not found! Please ensure you are in Petra/Misses browser.");
                return;
            }

            try {
                await window.aptos.connect();
                const account = await window.aptos.account();
                btn.innerText = account.address.substring(0, 6) + "..." + account.address.substring(account.address.length - 4);
                btn.style.backgroundColor = "#059669";
            } catch (error) {
                alert("Connection failed! Please unlock your wallet.");
            }
        }
    </script>
</body>
</html>
