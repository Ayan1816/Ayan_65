<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShelbyVault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #0a0f24; color: white; }</style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-[#111827] p-6 rounded-2xl border border-gray-800 shadow-2xl">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold">ShelbyVault</h1>
            <button id="connectBtn" onclick="tryConnect()" class="bg-red-600 px-4 py-2 rounded-lg font-bold">
                Connect Wallet
            </button>
        </div>
        <div class="border-2 border-dashed border-gray-600 p-8 rounded-xl text-center">
            <p>Choose Meme Image</p>
        </div>
    </div>

    <script>
        async function tryConnect() {
            const btn = document.getElementById("connectBtn");
            
            // চেক করা হচ্ছে পেট্রা ওয়ালেট ইনস্টল আছে কি না
            if (typeof window.aptos === 'undefined') {
                alert("Petra Wallet পাওয়া যায়নি। দয়া করে মিসেস ব্রাউজারে Petra Wallet এক্সটেনশনটি ওপেন রাখুন।");
                return;
            }

            try {
                // কানেক্ট রিকোয়েস্ট
                await window.aptos.connect();
                const account = await window.aptos.account();
                
                // কানেক্ট হলে বাটন আপডেট
                btn.innerText = "Connected";
                btn.style.backgroundColor = "green";
                alert("সাফল্যের সাথে কানেক্ট হয়েছে!");
            } catch (err) {
                console.error(err);
                alert("কানেকশন এরর: আপনার ওয়ালেটটি আনলক আছে তো?");
            }
        }
    </script>
</body>
</html>
