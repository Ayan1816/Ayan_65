<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelby Vault - Decentralized Meme Storage</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
        }

        .btn-wallet {
            background: #ed4c5c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-wallet.connected {
            background: #10b981;
        }

        .btn-wallet.disconnect-mode {
            background: #ef4444 !important;
        }

        .upload-section {
            border: 2px dashed #374151;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: #1f2937;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .btn-publish {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8, #0369a1);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .preview-box {
            display: none;
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="logo">
                <i class="fa-solid fa-vault"></i> ShelbyVault
            </div>
            <button class="btn-wallet" id="walletBtn" onclick="handleWalletAction()">Connect Petra</button>
        </div>

        <div class="upload-section" onclick="triggerFileInput()">
            <i class="fa-solid fa-cloud-arrow-up" style="font-size: 40px; color: #9ca3af; margin-bottom: 12px;"></i>
            <p style="font-weight: 600; margin-bottom: 4px;">Choose Meme Image</p>
            <p style="font-size: 12px; color: #9ca3af;">PNG, JPG or GIF up to 10MB</p>
            <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="previewImage(event)">
            <img id="imagePreview" class="preview-box" alt="Preview">
        </div>

        <div class="input-group">
            <label for="caption">Meme Caption / Description</label>
            <input type="text" id="caption" class="input-field" placeholder="Enter a funny caption...">
        </div>

        <button class="btn-publish" onclick="publishMeme()">
            <i class="fa-solid fa-rocket"></i> Publish to ShelbyNet (Testnet)
        </button>
    </div>

    <script>
        let userAptosAddress = null;
        let isConnected = false;

        // Petra প্রোভাইডার চেক করার উন্নত মেথড
        function getPetraProvider() {
            if ("aptos" in window) {
                return window.aptos;
            }
            if ("petra" in window) {
                return window.petra;
            }
            return null;
        }

        async function handleWalletAction() {
            const wallet = getPetraProvider();
            
            if (!wallet) {
                alert("Petra ওয়ালেট পাওয়া যায়নি! আপনার মিসেস ব্রাউজারে Petra এক্সটেনশনটি ইনস্টল বা আনলক করা আছে কিনা চেক করুন।");
                return;
            }

            if (isConnected) {
                try {
                    if (typeof wallet.disconnect === "function") {
                        await wallet.disconnect();
                    }
                    resetWalletUI();
                    alert("ওয়ালেট ডিসকানেক্ট করা হয়েছে।");
                } catch (error) {
                    console.error(error);
                    resetWalletUI(); 
                }
            } else {
                try {
                    // ডিরেক্টলি ওয়ালেট কানেক্ট ট্রাই করা
                    const account = await wallet.connect();
                    
                    // কানেকশন ডেটা সফল হলে UI আপডেট
                    if (account && account.address) {
                        setupConnectedUI(account.address);
                    } else {
                        // অল্টারনেটিভ চেক যদি অবজেক্ট অন্যভাবে ডেটা রিটার্ন করে
                        const currentAccount = await wallet.account();
                        if (currentAccount && currentAccount.address) {
                            setupConnectedUI(currentAccount.address);
                        }
                    }
                } catch (error) {
                    console.error("Connection error:", error);
                    
                    // মোবাইল ব্রাউজার এক্সটেনশনের ক্ষেত্রে পপ-আপ রিকোয়েস্ট ফেইল হলে এই অল্টারনেটিভ মেথডটি পুশ করবে
                    try {
                        alert("সরাসরি পপ-আপ না আসলে 'OK' প্রেস করুন। এরপর ব্রাউজারের Extensions মেনু থেকে Petra ওয়ালেটে ক্লিক করে ম্যানুয়ালি সাইন-ইন বা অ্যাপ্রুভ করুন।");
                        
                        // ব্যাকগ্রাউন্ডে চেক লুপ চালু করা যাতে ইউজার ওয়ালেটে ক্লিক করলেই কানেক্ট হয়ে যায়
                        const checkInterval = setInterval(async () => {
                            try {
                                const activeAcc = await wallet.account();
                                if (activeAcc && activeAcc.address) {
                                    setupConnectedUI(activeAcc.address);
                                    clearInterval(checkInterval);
                                }
                            } catch (e) {
                                // এখনো কানেক্ট হয়নি, লুপ চলতে থাকবে
                            }
                        }, 2000);

                        // ৩০ সেকেন্ড পর লুপ অটো বন্ধ হবে
                        setTimeout(() => clearInterval(checkInterval), 30000);

                    } catch (secError) {
                        alert("ওয়ালেট কানেক্ট করা সম্ভব হয়নি। পেজটি রিফ্রেশ দিয়ে আবার চেষ্টা করুন।");
                    }
                }
            }
        }

        function setupConnectedUI(address) {
            userAptosAddress = address;
            isConnected = true;
            const walletBtn = document.getElementById('walletBtn');
            const shortAddr = address.substring(0, 6) + "..." + address.substring(address.length - 4);
            
            walletBtn.innerText = shortAddr;
            walletBtn.className = "btn-wallet connected";

            walletBtn.onmouseover = function() {
                this.innerText = "Disconnect ❌";
                this.classList.add('disconnect-mode');
            };
            walletBtn.onmouseout = function() {
                if(isConnected) {
                    this.innerText = shortAddr;
                    this.classList.remove('disconnect-mode');
                }
            };
        }

        function resetWalletUI() {
            userAptosAddress = null;
            isConnected = false;
            const walletBtn = document.getElementById('walletBtn');
            walletBtn.innerText = "Connect Petra";
            walletBtn.className = "btn-wallet";
            walletBtn.onmouseover = null;
            walletBtn.onmouseout = null;
        }

        function triggerFileInput() {
            document.getElementById('fileInput').click();
        }

        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('imagePreview');
                output.src = reader.result;
                output.style.display = 'block';
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        function publishMeme() {
            if (!userAptosAddress) {
                alert("দয়া করে প্রথমে ওয়ালেট কানেক্ট করুন!");
                return;
            }
            alert("আপনার অ্যাকাউন্ট প্রস্তুত আছে। পরবর্তী ধাপে ছবি আপলোড সফল করতে Pinata IPFS API Key কনফিগার করতে হবে।");
        }
    </script>
</body>
</html>
