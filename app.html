<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayan - Portfolio</title>
    
    <!-- আপনার আগের ফন্ট বা অন্যান্য লিংক এখানে থাকলে রাখতে পারেন -->

    <style>
        /* ডিফল্ট ওয়ালেট বাটন স্টাইল */
        .btn-wallet {
            background-color: #4f46e5; /* সুন্দর বেগুনি/নীল রঙ */
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 180px; /* বাটন যাতে ছোট-বড় হয়ে কেঁপে না ওঠে */
            text-align: center;
            display: inline-block;
            margin: 10px;
        }

        .btn-wallet:hover {
            background-color: #4338ca;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        /* ওয়ালেট কানেক্ট হওয়ার পরের স্টাইল */
        .btn-wallet.connected {
            background-color: #10b981; /* সবুজ রঙ */
        }

        /* হোভার করে যখন ডিসকানেক্ট মোড অন হবে */
        .btn-wallet.disconnect-mode {
            background-color: #ef4444 !important; /* লাল রঙ */
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- আপনার অ্যাপের বাকি সব ডিজাইন বা HTML এখানে থাকবে -->
    <!-- ========================================== -->
    
    <!-- ওয়ালেট কানেক্ট বাটনটি যেখানে দেখাতে চান সেখানে এটি থাকবে -->
    <div style="text-align: center; margin-top: 20px;">
        <button id="walletBtn" class="btn-wallet" onclick="handleWalletAction()">
            Connect Wallet
        </button>
    </div>

    <!-- ========================================== -->
    <!-- জাভাস্ক্রিপ্ট লজিক (যা Petra ওয়ালেট হ্যান্ডেল করবে) -->
    <!-- ========================================== -->
    <script>
        // ১. স্টেট ভেরিয়েবলস (ওয়ালেটের অবস্থা ট্র্যাকিং)
        let userAptosAddress = null;
        let isConnected = false;

        // ২. Petra প্রোভাইডার চেক করার ফাংশন
        function getPetraProvider() {
            if ('aptos' in window) return window.aptos;
            if ('petra' in window) return window.petra;
            return null;
        }

        // ৩. মেইন হ্যান্ডলার (বাটনে ক্লিক করলে যা হবে)
        function handleWalletAction() {
            if (!isConnected) {
                connectWallet();
            } else {
                disconnectWallet();
            }
        }

        // ৪. ওয়ালেট কানেক্ট করার লজিক
        async function connectWallet() {
            const provider = getPetraProvider();
            
            if (!provider) {
                alert("Petra Aptos Wallet খুঁজে পাওয়া যায়নি! দয়া করে এক্সটেনশনটি ইনস্টল করুন।");
                window.open("https://petra.app/", "_blank");
                return;
            }

            try {
                // Petra ওয়ালেটে কানেকশন রিকোয়েস্ট পাঠানো
                const response = await provider.connect();
                
                // অ্যাড্রেস ও স্টেট সেভ করা
                userAptosAddress = response.address;
                isConnected = true;
                
                // UI আপডেট করা
                setupConnectedUI(userAptosAddress);
                alert("ওয়ালেট সফলভাবে কানেক্ট হয়েছে! 🎉");
                
            } catch (error) {
                console.error("Connection rejected:", error);
                alert("কানেকশন রিকোয়েস্ট বাতিল করা হয়েছে।");
            }
        }

        // ৫. ওয়ালেট ডিসকানেক্ট করার লজিক
        async function disconnectWallet() {
            const provider = getPetraProvider();
            if (!provider) return;

            try {
                await provider.disconnect();
                
                // স্টেট ক্লিয়ার করা
                userAptosAddress = null;
                isConnected = false;
                
                // UI রিসেট করা
                resetWalletUI();
                alert("ওয়ালেট ডিসকানেক্ট করা হয়েছে।");
                
            } catch (error) {
                console.error("Disconnection failed:", error);
            }
        }

        // ৬. কানেক্টেড UI এবং হোভার ইফেক্ট (ভিডিওর মতো এক্সাক্ট লজিক)
        function setupConnectedUI(address) {
            const walletBtn = document.getElementById("walletBtn");
            if (!walletBtn) return;

            // অ্যাড্রেস ছোট করা (যেমন: 0x4f1f...3eb5)
            const shortAddr = address.substring(0, 6) + "..." + address.substring(address.length - 4);
            
            walletBtn.innerText = shortAddr;
            walletBtn.classList.add("connected");
            
            // মাউস উপরে আনলে "Disconnect X" দেখাবে
            walletBtn.onmouseover = function() {
                this.innerText = "Disconnect X";
                this.classList.add("disconnect-mode");
            };
            
            // মাউস সরিয়ে নিলে আবার অ্যাড্রেস দেখাবে
            walletBtn.onmouseout = function() {
                this.innerText = shortAddr;
                this.classList.remove("disconnect-mode");
            };
        }

        // ७. ডিসকানেক্টের পর UI আগের অবস্থায় নেওয়া
        function resetWalletUI() {
            const walletBtn = document.getElementById("walletBtn");
            if (!walletBtn) return;

            walletBtn.innerText = "Connect Wallet";
            walletBtn.className = "btn-wallet"; // ডিফল্ট ক্লাসে ফেরত নেওয়া
            
            // হোভার ইভেন্টগুলো মুছে ফেলা
            walletBtn.onmouseover = null;
            walletBtn.onmouseout = null;
        }
    </script>
</body>
</html>
  // হোভার ইভেন্টগুলো মুছে ফেলা
  walletBtn.onmouseover = null;
  walletBtn.onmouseout = null;
}
