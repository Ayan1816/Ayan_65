<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShelbyVault</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f19] text-white flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md p-6 bg-[#111827] border border-gray-800 rounded-2xl shadow-2xl">
        <div class="flex items-center justify-between mb-6">
            <span class="text-lg font-bold">ShelbyVault</span>
            <button id="walletBtn" onclick="connectWallet()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-bold">
                Connect Petra
            </button>
        </div>
        
        <div class="border-2 border-dashed border-gray-600 p-8 rounded-xl text-center">
            <p>Choose Meme Image</p>
        </div>
        
        <input type="text" placeholder="Caption.." class="w-full mt-4 p-3 bg-gray-900 border border-gray-700 rounded-lg text-white">
        <button class="w-full mt-4 bg-blue-600 p-3 rounded-lg font-bold">Publish</button>
    </div>

    <script>
        // ওয়ালেট কানেক্ট করার লজিক
        async function connectWallet() {
            const btn = document.getElementById('walletBtn');
            
            // Petra ওয়ালেট চেক করা
            if (!window.aptos) {
                alert("Petra Wallet খুঁজে পাওয়া যায়নি! দয়া করে Petra এক্সটেনশনটি ওপেন করুন।");
                window.open("https://petra.app/", "_blank");
                return;
            }

            try {
                // কানেক্ট রিকোয়েস্ট
                const response = await window.aptos.connect();
                
                // বাটন আপডেট করা
                btn.innerText = response.address.substring(0, 6) + "...";
                btn.classList.replace('bg-red-500', 'bg-green-600');
                
                // ডিসকানেক্টের জন্য ফাংশন পরিবর্তন
                btn.onclick = async () => {
                    await window.aptos.disconnect();
                    btn.innerText = "Connect Petra";
                    btn.classList.replace('bg-green-600', 'bg-red-500');
                    btn.onclick = connectWallet;
                };
            } catch (err) {
                console.error(err);
                alert("কানেকশন রিকোয়েস্ট বাতিল হয়েছে। ওয়ালেটের ভেতর দেখুন কোনো পেন্ডিং রিকোয়েস্ট আছে কি না।");
            }
        }
    </script>
</body>
</html>
