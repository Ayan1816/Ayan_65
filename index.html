<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShelbyVault - Meme Publisher</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0b0f19; color: #ffffff; }
        .btn-wallet { background-color: #ef4444; color: #ffffff; padding: 10px 20px; border-radius: 20px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .btn-wallet.connected { background-color: #10b981 !important; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-6 bg-[#111827] border border-gray-800 rounded-2xl shadow-2xl">
        <div class="flex items-center justify-between mb-6">
            <span class="text-lg font-bold">ShelbyVault</span>
            <button id="walletBtn" class="btn-wallet" onclick="connectWallet()">Connect Petra</button>
        </div>
    </div>

    <script>
        async function connectWallet() {
            try {
                // Petra ওয়ালেটের জন্য নতুন স্ট্যান্ডার্ড
                if (window.aptos) {
                    const response = await window.aptos.connect();
                    const btn = document.getElementById("walletBtn");
                    btn.innerText = response.address.substring(0, 6) + "...";
                    btn.classList.add("connected");
                    alert("ওয়ালেট সফলভাবে কানেক্ট হয়েছে!");
                } else {
                    alert("Petra ওয়ালেট এক্সটেনশনটি ওপেন নেই!");
                }
            } catch (error) {
                console.error(error);
                // যদি কানেক্ট না হয়, তবে ব্রাউজারের পপ-আপ রিকোয়েস্ট চেক করতে বলছি
                alert("কানেকশন রিকোয়েস্টটি ওয়ালেটে চেক করুন।");
            }
        }
    </script>
</body>
</html>
